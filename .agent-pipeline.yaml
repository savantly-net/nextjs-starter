# .agent-pipeline.yaml — target-repo invocation contract for the agent
# pipeline (savantly-net/agent-pipeline). Owned by this repo; declares HOW
# the pipeline's sandbox should install + test + lint + typecheck this
# project. The pipeline owns stack identity (which prompt template, which
# gate parsers); we own invocation. See ADR-013 in agent-pipeline:
# docs/architecture/decisions/adr-013-target-repo-invocation-contract.md.
#
# Schema version is pinned — bump only when an ADR explicitly migrates it.
version: 1

sandbox:
  # Uses the pipeline's typescript-nextjs default base image (node:22) —
  # no override needed.
  install_cmd: "npm install --no-audit --no-fund"

test:
  cmd: "npm test"
  timeout_ms: 300000
  # Story 2.5 no-test-harness probe — exits 0 iff package.json's scripts.test
  # is a non-empty string. Refuses the ticket with `no_test_harness` before
  # the agent burns tokens if test harness is missing.
  presence_cmd: "node -e \"const p=JSON.parse(require('fs').readFileSync('/workspace/package.json','utf8'));process.exit(p.scripts&&typeof p.scripts.test==='string'&&p.scripts.test.length?0:1)\""

gates:
  lint:
    presence_cmd: "npx --no-install eslint --version >/dev/null 2>&1"
    config_glob: ".eslintrc* eslint.config.*"
    # Must invoke the `eslint` binary as a word — anti-gaming guard
    # (ADR-013 §Decision §4). The pipeline's eslint-json parser reads this
    # output.
    run_cmd: "npx --no-install eslint . -f json --ext .js,.jsx,.ts,.tsx 2>/dev/null || true"
  typecheck:
    presence_cmd: "npx --no-install tsc --version >/dev/null 2>&1"
    # Must invoke `tsc` as a word — same anti-gaming guard as lint.
    run_cmd: "npx --no-install tsc --noEmit --pretty false"
